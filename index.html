*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
main{max-width:760px;margin:auto;padding:12px}

.card h3{margin:4px 0;font-size:16px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin:2px 3px 2px 0}
.v1{color:#1a8f4a;border-color:#1a8f4a}.v2{color:var(--wa);border-color:var(--wa)}.v3{color:var(--er);border-color:var(--er)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--pr);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button.g,.btn.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--er)}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}

<div class="row" style="margin-top:8px">${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Apply (official)</a>`:""}${s?`<a class="btn g" href="${esc(s)}" target="_blank" rel="noopener noreferrer">Source</a>`:""}<button class="g" data-sv="${o.id}">${b?"★ Saved":"☆ Save"}</button><button class="g" data-sh="${o.id}">Share</button><button class="g" data-cp="${o.id}">Copy</button>${o.deadline?`<button class="g" data-rm="${o.id}">⏰ Remind</button>`:""}<button class="g" data-rp="${o.id}">⚑ Report</button>
${b?`<select data-tr="${o.id}" style="margin-top:8px"><option value="">Track: not applied</option>${["Applied","Interview","Result"].map(x=>`<option ${track[o.id]===x?"selected":""}>${x}</option>`).join("")}</select>`:""}${adm?`<button class="g" data-ed="${o.id}">Edit</button><button class="g" data-vf="${o.id}">${o.status==="verified"?"Unverify":"Verify"}</button><button class="g" data-ft="${o.id}">Feature</button><button class="d" data-dl="${o.id}">Delete</button>`:""}</div></div>`}
const list=a=>a.length?a.map(o=>card(o,S.admin&&S.tab==="admin")).join(""):'<div class="empty">Nothing here yet. Verified opportunities added by the administrator will appear here.</div>';
const match=(o,q)=>!q||[o.title,o.org,o.category,o.location,o.eligibility,o.qualification].join(" ").toLowerCase().includes(q.toLowerCase());
const chips=()=>`<div class="chips"><button data-c="" class="${S.cat?"":"on"}">All</button>${CATS.map(c=>`<button data-c="${esc(c)}" class="${S.cat===c?"on":""}">${esc(c)}</button>`).join("")}</div>`;

function view(){const t=S.tab;let h="";
if(t==="home"){const L=live(),cs=L.filter(o=>o.deadline&&days(o)<=7).sort((a,b)=>a.deadline>b.deadline?1:-1);
h=(()=>{const n=S.opps.filter(o=>saved.includes(o.id)&&!exp(o)&&days(o)!==null&&days(o)<=3);return n.length?`<div class="card" style="border-color:var(--wa)">⏰ ${n.length} saved opportunit${n.length>1?"ies close":"y closes"} within 3 days.</div>`:""})()+(S.ann?`<div class="card" style="border-color:var(--ac)">📢 ${esc(S.ann)}</div>`:"")+`<h2>Categories</h2>${chips()}`+forYou()+
(S.cat?`<h2>${esc(S.cat)}</h2>${list(L.filter(o=>o.category===S.cat))}`:`<h2>★ Featured</h2>${list(L.filter(o=>o.featured).slice(0,5))}<h2>⏳ Closing soon</h2>${list(cs.slice(0,5))}<h2>🆕 Latest</h2>${list([...L].sort((a,b)=>(b.posted||"")>(a.posted||"")?1:-1).slice(0,10))}`)+
`<h2>Submit an opportunity</h2><div class="card"><div class="mu">Know a legitimate opportunity? Send it for review.</div><input id="sl" placeholder="Official link (https://…)"><textarea id="sn" rows="2" placeholder="Short description"></textarea><button id="ss">Submit for review</button></div>`}
if(t==="search"){const L=live().filter(o=>match(o,S.q)&&(!S.cat||o.category===S.cat));
h=`<div class="row" style="flex-wrap:nowrap"><button class="${S.mode==="own"?"":"g"}" data-md="own">Abbas Search</button><button class="${S.mode==="web"?"":"g"}" data-md="web">Web / Google</button></div>
<input id="q" type="search" placeholder="${S.mode==="own"?"Search stored opportunities…":"Search the wider web…"}" value="${esc(S.q)}">`+
(S.mode==="own"?`${chips()}<div class="mu">Results below are stored and categorised in Abbas Opportunities.</div>${list(L)}`:
`<div class="card"><span class="tag v2">⚠ Web results – not verified by Abbas Opportunities</span><p class="mu">Opens Google in a new tab with your query. Always confirm on the official site before applying. Never pay to apply.</p>
<div class="row"><a class="btn" id="gw" target="_blank" rel="noopener noreferrer" href="#">Search Google</a><a class="btn g" id="go" target="_blank" rel="noopener noreferrer" href="#">Official sites (.gov.ng)</a></div></div>`)}
if(t==="ai"){h=`<div class="mu">Ask about jobs, scholarships, NELFUND, deadlines or eligibility. The assistant only reports opportunities stored on the platform and flags anything unverified.</div>
<div id="cl">${S.chat.map(c=>`<div class="bub ${c.r==="u"?"me":"ai"}">${esc(c.t)}</div>`).join("")}</div>
<div class="chips">${["Which opportunities are closing this week?","What NELFUND opportunities are available?","Scholarships open for Nigerians?","Internships for a 400-level engineering student"].map(x=>`<button data-ex="${esc(x)}">${esc(x)}</button>`).join("")}</div>
<div class="row" style="flex-wrap:nowrap"><input id="ai" placeholder="Ask the assistant…"><button id="as" style="flex:none">Send</button></div>`}
if(t==="chan"){h=`<h2>📣 Channel Highlights</h2><div class="mu">WhatsApp does not offer a public feed for embedding, so posts are curated by the administrator. Follower counts are not shown because none are publicly available.</div>`+
CH.map((u,i)=>`<div class="card"><b>Channel ${i+1}</b><div class="mu">Official WhatsApp Channel</div><a class="btn" href="${u}" target="_blank" rel="noopener noreferrer" style="margin-top:6px">Open & follow</a></div>`).join("")+
`<h2>Recent highlights</h2>`+(S.posts.length?S.posts.map(p=>`<div class="card"><div class="mu">${esc(p.channel||"Channel")} · ${esc(p.date||"")}</div><p>${esc(p.text)}</p>${safe(p.url)?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">View on WhatsApp</a>`:""}${S.admin?` <button class="d" data-dp="${p.id}">Delete</button>`:""}</div>`).join(""):'<div class="empty">No highlights posted yet.</div>')}
if(t==="saved"){h=`${profCard()}<h2>★ Saved</h2>${list(S.opps.filter(o=>saved.includes(o.id)))}`}
if(t==="admin"){h=S.admin?adminView():`<div class="empty">Admin dashboard is only available to the page owner / editors.</div>`}
$("#m").innerHTML=h;bind()}

function forYou(){if(S.cat)return"";if(!(prof.course||prof.state||(prof.cats||[]).length))return`<div class="card"><b>🎯 Personalise your feed</b><div class="mu">Tell us your course, level and state to see matches first.</div><button data-t2="saved" style="margin-top:6px">Set up profile</button></div>`;
const L=live().map(o=>[score(o),o]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]);return`<h2>🎯 For you</h2>${list(L)}`}
function profCard(){return`<div class="card"><b>🎯 My profile</b><div class="mu">Used only on this device to rank opportunities for you.</div><input id="pco" placeholder="Course (e.g. Electrical Engineering)" value="${esc(prof.course||"")}"><div class="row"><input id="plv" placeholder="Level (e.g. 400)" value="${esc(prof.level||"")}"><input id="pst" placeholder="State (e.g. Kaduna)" value="${esc(prof.state||"")}"></div><div class="mu">Interests</div><div class="chips" style="flex-wrap:wrap">${CATS.map(c=>`<button data-pc="${esc(c)}" class="${(prof.cats||[]).includes(c)?"on":""}">${esc(c)}</button>`).join("")}</div><button id="psv" style="margin-top:8px">Save profile</button></div>
<div class="card" style="border-color:var(--wa)"><b>⚠ Avoid scams</b><div class="mu">Real applications never ask you to pay to be considered. Apply only on official .gov.ng or company sites, never share your BVN, ATM PIN or passwords, and report anything suspicious using ⚑ Report.</div></div>`}
function adminView(){const e=S.ed||{};const f=(k,p,ty="text")=>`<input data-f="${k}" type="${ty}" placeholder="${p}" value="${esc(e[k]||"")}">`;
return `<h2>Admin dashboard</h2><div class="card"><b>📋 Quick paste from WhatsApp</b><div class="mu">Copy a post from your channel, paste it here. Links, title, deadline and category are filled in automatically as an unverified draft. Check, then Verify.</div><textarea id="qp" rows="5" placeholder="Paste the post exactly as it is…"></textarea><button id="qb">Create draft</button></div><div class="card"><b>${e.id?"Edit":"Add"} opportunity</b>${f("title","Title")}${f("org","Organization")}
<select data-f="category">${CATS.map(c=>`<option ${e.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select>${f("location","Location")}
<select data-f="mode">${["On-site","Remote","Hybrid"].map(c=>`<option ${e.mode===c?"selected":""}>${c}</option>`).join("")}</select>
${f("eligibility","Eligibility")}${f("qualification","Qualification")}${f("benefits","Benefits/salary (only if officially stated)")}
<label class="mu">Deadline</label>${f("deadline","","date")}${f("sourceUrl","Original source URL","url")}${f("applyUrl","Official application URL","url")}
<select data-f="status">${["unverified","verified","expired"].map(c=>`<option ${e.status===c?"selected":""}>${c}</option>`).join("")}</select>
<button id="sa">Save</button> ${e.id?'<button class="g" id="sc">Cancel</button>':""}</div>
<div class="card"><b>Announcement</b><input id="an" value="${esc(S.ann)}" placeholder="Shown on home page"><button id="asv">Update</button></div>
<div class="card"><b>Add channel highlight</b><input id="pc" placeholder="Channel name"><textarea id="pt" rows="2" placeholder="Post summary"></textarea><input id="pu" placeholder="Link (optional)"><button id="pa">Add</button></div>
<h2>Submissions (${S.subs.length})</h2>${S.subs.map(s=>`<div class="card"><p>${esc(s.note)}</p><div class="mu">${esc(s.link)}</div><button class="d" data-ds="${s.id}">Dismiss</button></div>`).join("")||'<div class="empty">None</div>'}
<h2>All opportunities (${S.opps.length})</h2><button class="g" data-clr="1">Remove expired</button>${list(S.opps)}`}

async function w(fn){try{await fn()}catch(x){alert("Action failed: "+(x.message||x.code||x))}}
function bind(){const m=$("#m");
m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;view()});
m.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.md;view()});
m.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{const i=b.dataset.sv;saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];ls.set("saved",saved);view()});
m.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>ask(b.dataset.ex));
m.querySelectorAll("[data-t2]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t2;nav();view()});
m.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const c=b.dataset.pc,a=prof.cats||[];prof.cats=a.includes(c)?a.filter(x=>x!==c):[...a,c];b.classList.toggle("on")});
const ps=$("#psv");if(ps)ps.onclick=()=>{prof.course=$("#pco").value;prof.level=$("#plv").value;prof.state=$("#pst").value;ls.set("prof",prof);alert("Profile saved. Check Home for matches.")};
const og=id=>S.opps.find(o=>o.id===id);
m.querySelectorAll("[data-tr]").forEach(b=>b.onchange=()=>{track[b.dataset.tr]=b.value;ls.set("track",track)});
m.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{const o=og(b.dataset.sh),u=safe(o.applyUrl)||safe(o.sourceUrl),t=`${o.title} – ${o.org}\nDeadline: ${o.deadline||"not stated"}\n${u}\n\nvia Abbas Opportunities`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank","noopener")});
m.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>w(async()=>{const o=og(b.dataset.rm),dl=await claude.use("downloads");if(!dl)return alert("Downloads unavailable here.");const d=o.deadline.replace(/-/g,""),p=new Date(o.deadline+"T00:00:00");p.setDate(p.getDate()+1);const e=p.toISOString().slice(0,10).replace(/-/g,"");
const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Abbas Opportunities//EN","BEGIN:VEVENT","UID:"+o.id+"@abbas","DTSTAMP:"+new Date().toISOString().replace(/[-:]|\.\d+/g,""),"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+e,"SUMMARY:Deadline: "+o.title.replace(/[\n,;]/g," "),"DESCRIPTION:"+(safe(o.applyUrl)||safe(o.sourceUrl)||""),"BEGIN:VALARM","TRIGGER:-P3D","ACTION:DISPLAY","DESCRIPTION:Deadline in 3 days","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
await dl.save({filename:"deadline.ics",data:ics})}));
m.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>w(async()=>{const o=og(b.dataset.rp),r=prompt("Why are you reporting this? (fake, asks for payment, expired link…)");if(!r||!S.db)return;await S.db.collection("subs").add({link:"REPORT: "+o.title+" ("+o.id+")",note:r,at:Date.now()});alert("Thanks, the administrator will review it.")}));
m.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const o=S.opps.find(x=>x.id===b.dataset.cp);try{await navigator.clipboard.writeText(o.details||`${o.title}\n${safe(o.applyUrl)||safe(o.sourceUrl)}`);b.textContent="Copied ✓"}catch{alert("Copy not allowed here")}});
const q=$("#q");if(q){q.oninput=()=>{S.q=q.value;if(S.mode==="own"){clearTimeout(q._t);q._t=setTimeout(()=>{view();const n=$("#q");n.focus();n.setSelectionRange(99,99)},250)}else gl()};gl()}
function gl(){const a=$("#gw");if(!a)return;const t=encodeURIComponent(S.q||"opportunities Nigeria");a.href="https://www.google.com/search?q="+t;$("#go").href="https://www.google.com/search?q="+t+"+site%3Agov.ng"}
const as=$("#as");if(as){as.onclick=()=>ask($("#ai").value);$("#ai").onkeydown=e=>{if(e.key==="Enter")ask(e.target.value)}}
const ss=$("#ss");if(ss)ss.onclick=()=>w(async()=>{const l=$("#sl").value.trim(),n=$("#sn").value.trim();if(!safe(l)||!n)return alert("Enter an https link and description");await S.db.collection("subs").add({link:l,note:n,at:Date.now()});$("#sl").value=$("#sn").value="";alert("Thanks! Submitted for review.")});
if(!S.admin||S.tab!=="admin")return;
const C=S.db.collection("opps");
const g=id=>S.opps.find(o=>o.id===id);
m.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{S.ed=g(b.dataset.ed);view();scrollTo(0,0)});
m.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>confirm("Delete?")&&w(()=>C.doc(b.dataset.dl).delete()));
m.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{const o=g(b.dataset.vf);w(()=>C.doc(o.id).set({...o,id:undefined,status:o.status==="verified"?"unverified":"verified"}))});
m.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{const o=g(b.dataset.ft);w(()=>C.doc(o.id).set({...o,id:undefined,featured:!o.featured}))});
m.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>w(()=>S.db.collection("posts").doc(b.dataset.dp).delete()));
m.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>w(()=>S.db.collection("subs").doc(b.dataset.ds).delete()));
m.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>w(async()=>{for(const o of S.opps.filter(exp))await C.doc(o.id).delete()}));
const sa=$("#sa");if(sa)sa.onclick=()=>w(async()=>{const d={...(S.ed||{})};delete d.id;m.querySelectorAll("[data-f]").forEach(i=>d[i.dataset.f]=i.value.trim());
if(!d.title||!d.org)return alert("Title and organization required");if(d.sourceUrl&&!safe(d.sourceUrl)||d.applyUrl&&!safe(d.applyUrl))return alert("Links must start with http(s)://");
if(!d.posted)d.posted=new Date().toISOString().slice(0,10);if(S.ed)await C.doc(S.ed.id).set(d);else await C.add(d);S.ed=null;view()});
const qb=$("#qb");if(qb)qb.onclick=()=>w(async()=>{const t=$("#qp").value.trim();if(!t)return;const u=(t.match(/https?:\/\/[^\s)]+/g)||[]).filter(x=>!/whatsapp\.com/.test(x));
const title=(t.split("\n").map(x=>x.replace(/[*_~`#>]|[\u{1F000}-\u{1FAFF}\u2600-\u27BF]/gu,"").trim()).find(x=>x.length>6)||"Untitled").slice(0,140);
let dl="";const mm=t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?([A-Za-z]{3,9})[,\s]+(20\d\d)/)||null;if(mm){const d=new Date(mm[1]+" "+mm[2]+" "+mm[3]+" 12:00");if(!isNaN(d))dl=d.toISOString().slice(0,10)}
else{const i=t.match(/(20\d\d)-(\d\d)-(\d\d)/);if(i)dl=i[0]}
const K=[["NELFUND",/nelfund|student loan/i],["NYSC News & Opportunities",/nysc|corper/i],["Internships & SIWES",/siwes|intern/i],["Scholarships",/scholarship|bursary/i],["Fellowships",/fellowship/i],["Remote Jobs",/remote/i],["Government Training",/training|bootcamp/i],["Empowerment Programmes",/empower|grant|funding/i],["Engineering & Technology Jobs",/engineer|developer|software/i],["Government Jobs",/ministry|federal|civil service|recruitment/i],["Graduate Opportunities",/graduate trainee|graduate/i]];
const cat=(K.find(k=>k[1].test(t))||["Jobs in Nigeria"])[0];
await S.db.collection("opps").add({title,org:"See post",category:cat,location:"",mode:/remote/i.test(t)?"Remote":"On-site",details:t,applyUrl:u[0]||"",sourceUrl:u[1]||u[0]||"",deadline:dl,status:"unverified",posted:new Date().toISOString().slice(0,10)});$("#qp").value="";alert("Draft created (unverified). Edit it below, then Verify.")});
const sc=$("#sc");if(sc)sc.onclick=()=>{S.ed=null;view()};
$("#asv").onclick=()=>w(()=>S.db.doc("meta/announcement").set({text:$("#an").value}));
$("#pa").onclick=()=>w(async()=>{if(!$("#pt").value.trim())return;await S.db.collection("posts").add({channel:$("#pc").value,text:$("#pt").value,url:$("#pu").value,date:new Date().toISOString().slice(0,10)});view()})}

async function ask(t){t=(t||"").trim();if(!t)return;S.chat.push({r:"u",t});S.chat.push({r:"a",t:"Thinking…"});view();const i=S.chat.length-1;
try{const sm=await claude.use("sample");if(!sm)throw{message:"AI assistant is unavailable in this view."};
const sys=`You are the Abbas Opportunities assistant for Nigerian users. Today is ${new Date().toISOString().slice(0,10)}. You MUST use the search_platform tool to find opportunities; report ONLY what it returns. Never invent opportunities, deadlines, organizations or links. If nothing matches, say so and suggest the Web/Google search tab, noting web results are unverified. For each result give title, organization, deadline, eligibility, status (verified or needs verification) and the official application/source link. Explain eligibility simply. Warn users never to pay to apply. Be concise.`;
const turns=S.chat.slice(0,-1).slice(-8).map(c=>({role:c.r==="u"?"user":"assistant",content:c.t}));
const r=await sm([{role:"user",content:sys},{role:"assistant",content:"Understood."},...turns],{cache:false,tools:[{name:"search_platform",description:"Search stored opportunities by keywords; optional category and closing_within_days.",inputSchema:{type:"object",properties:{keywords:{type:"string"},category:{type:"string"},closing_within_days:{type:"number"}}},execute:a=>{const k=(a.keywords||"").toLowerCase().split(/\s+/).filter(x=>x.length>2);let L=live();if(a.category)L=L.filter(o=>o.category.toLowerCase().includes(a.category.toLowerCase()));if(a.closing_within_days)L=L.filter(o=>o.deadline&&days(o)<=a.closing_within_days);if(k.length)L=L.filter(o=>k.some(w=>match(o,w)));return L.slice(0,8).map(o=>({title:o.title,org:o.org,category:o.category,location:o.location,mode:o.mode,eligibility:o.eligibility,qualification:o.qualification,benefits:o.benefits,deadline:o.deadline,status:o.status==="verified"?"verified":"needs verification",applyUrl:o.applyUrl,sourceUrl:o.sourceUrl}))}}],onText:({text})=>{S.chat[i].t=text;const b=document.querySelectorAll("#cl .bub");if(b.length)b[b.length-1].textContent=text}});
S.chat[i].t=r.text}catch(e){S.chat[i].t=e.code==="not_granted"?"Permission to use the AI assistant was declined.":"Sorry, the assistant couldn't answer: "+(e.message||e.code||"error")}view()}

const TABS=[["home","🏠","Home"],["search","🔎","Search"],["ai","🤖","AI"],["chan","📣","Channels"],["saved","★","Saved"]];
function nav(){const T=[...TABS];if(S.admin)T.push(["admin","⚙️","Admin"]);$("#nv").innerHTML=T.map(([k,i,l])=>`<button data-t="${k}" class="${S.tab===k?"on":""}"><b>${i}</b>${l}</button>`).join("");
document.querySelectorAll("#nv [data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.cat="";nav();view();scrollTo(0,0)})}
nav();view();
if("serviceWorker"in navigator){}
(async()=>{try{const u=await claude.use("user");S.admin=!!(u&&u.canEdit&&u.canEdit());const db=await claude.use("db");if(!db)return;S.db=db;
const mk=(c,k)=>db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))view()},()=>{});
mk("opps","opps");mk("posts","posts");if(S.admin)mk("subs","subs");
db.doc("meta/announcement").onSnapshot(d=>{S.ann=d.exists?d.data().text||"":"";if(S.tab==="home")view()},()=>{});nav()}catch(e){}})();
</script></body></html>
